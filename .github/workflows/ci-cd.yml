name: Java CI/CD

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    name: Build & Test (matrix)
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for Gradle wrapper (Linux/macOS)
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Build & Test
        run: ./gradlew clean build test --no-daemon

      - name: Run Spotless check
        run: ./gradlew spotlessCheck --no-daemon

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build application (release)
        run: ./gradlew clean build --no-daemon

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
              cd /var/www/my-app || exit 1
  
              echo "Pull latest changes from Git..."
              git pull origin main
  
              echo "Build on server..."
              ./gradlew clean build --no-daemon
  
              echo "Stop previous app instance (if any)..."
              pkill -f 'java -jar' || true
  
              echo "Start new app version..."
              nohup java -jar build/libs/*.jar > app.log 2>&1 &
  
              echo "Deploy finished."
