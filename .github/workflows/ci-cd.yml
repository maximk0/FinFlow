name: Java CI/CD

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    name: Build & Test (matrix)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for Gradle wrapper (Linux/macOS)
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Build & Test
        run: ./gradlew clean build test --no-daemon

      - name: Run Spotless check
        run: ./gradlew spotlessCheck --no-daemon

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build application (release)
        run: ./gradlew clean build --no-daemon

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /var/www/my-app
            # сюда ты пишешь свои команды деплоя,
            # например: остановить старый сервис, скопировать новый .jar, перезапустить:
            # systemctl stop my-app || true
            # rm -f my-app.jar
            # # здесь можно заранее клонировать репозиторий или забрать артефакт
            # cp /some/path/build/libs/my-app.jar ./my-app.jar
            # systemctl start my-app
